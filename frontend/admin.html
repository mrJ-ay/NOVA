<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA 관리자 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .admin-title-area {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .video-count-badge {
            background: #2a2a2a;
            color: #4da6ff;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background: #181818;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #292929;
        }
        .admin-table th, .admin-table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #282828;
        }
        .admin-table th {
            background: #202020;
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .admin-table tr:hover {
            background: #222;
        }
        .admin-thumb {
            width: 90px;
            height: 52px;
            background: #000;
            border-radius: 4px;
            object-fit: cover;
        }
        .video-link {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }
        .video-link:hover {
            color: #4da6ff;
            text-decoration: underline;
        }
        .delete-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.15s;
        }
        .delete-btn:hover {
            background: #ff2a38;
        }
        .delete-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .admin-search-bar {
            margin-bottom: 20px;
            display: flex;
            max-width: 400px;
        }
        .admin-search-bar input {
            flex: 1;
            padding: 10px 14px;
            background: #1c1c1c;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            outline: none;
        }
    </style>
</head>
<body>
<header class="navbar">
    <div class="logo">NOVA <span style="font-size: 13px; background: #e50914; padding: 2px 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px;">ADMIN</span></div>
    <div class="nav-buttons" id="navButtons">
        <a href="index.html">홈으로</a>
        <a href="upload.html">업로드</a>
    </div>
</header>

<main class="container">
    <div class="admin-header">
        <div class="admin-title-area">
            <h1>영상 통합 관리</h1>
            <span class="video-count-badge" id="videoCount">0개 영상</span>
        </div>
    </div>

    <div class="admin-search-bar">
        <input id="searchInput" type="search" placeholder="영상 제목 검색..." aria-label="영상 제목 검색">
    </div>

    <div style="overflow-x: auto;">
        <table class="admin-table">
            <thead>
                <tr>
                    <th style="width: 110px;">미리보기</th>
                    <th>제목</th>
                    <th style="width: 180px;">등록일시</th>
                    <th style="width: 100px; text-align: center;">관리</th>
                </tr>
            </thead>
            <tbody id="videoTableBody">
                <tr><td colspan="4" style="text-align: center; color: #888; padding: 40px;">영상 목록을 불러오는 중...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script type="module">
import { API_BASE_URL } from "./api-config.js";
import { ONEID_API_URL, ONEID_TOKEN_KEY } from "./oneid-config.js";
import { initAuthNav } from "./auth-nav.js";

const tableBody = document.getElementById("videoTableBody");
const videoCount = document.getElementById("videoCount");
const searchInput = document.getElementById("searchInput");

let allVideos = [];
let token = sessionStorage.getItem(ONEID_TOKEN_KEY) || localStorage.getItem(ONEID_TOKEN_KEY);

async function checkAdminAuth() {
    if (!token) {
        alert("관리자 로그인이 필요합니다.");
        location.href = "login.html?returnTo=admin.html";
        return false;
    }

    try {
        const res = await fetch(`${ONEID_API_URL}/api/auth/me`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) {
            alert("로그인이 만료되었습니다.");
            location.href = "login.html?returnTo=admin.html";
            return false;
        }
        const user = await res.json();
        if (!user.is_admin && user.role !== "admin") {
            alert("관리자만 접근할 수 있는 페이지입니다.");
            location.href = "index.html";
            return false;
        }
        return true;
    } catch {
        // 오프라인/네트워크 에러 시 캐시 확인
        const cached = JSON.parse(sessionStorage.getItem("nova_user") || localStorage.getItem("nova_user") || "{}");
        if (!cached.is_admin && cached.role !== "admin") {
            alert("관리자 권한이 필요합니다.");
            location.href = "index.html";
            return false;
        }
        return true;
    }
}

function renderTable(query = "") {
    const q = query.trim().toLowerCase();
    const filtered = allVideos.filter(v => (v.title || "").toLowerCase().includes(q));
    videoCount.textContent = `총 ${filtered.length}개 영상`;

    tableBody.replaceChildren();

    if (filtered.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" style="text-align: center; color: #888; padding: 40px;">${q ? "검색 결과가 없습니다." : "등록된 영상이 없습니다."}</td>`;
        tableBody.appendChild(tr);
        return;
    }

    filtered.forEach(v => {
        const tr = document.createElement("tr");
        const dateStr = v.created_at ? new Date(v.created_at).toLocaleString("ko-KR") : "-";

        tr.innerHTML = `
            <td>
                <video class="admin-thumb" src="${v.url}" muted preload="metadata"></video>
            </td>
            <td>
                <a class="video-link" href="player.html?video=${encodeURIComponent(v.id)}" target="_blank">${escapeHtml(v.title || "제목 없음")}</a>
            </td>
            <td style="color: #aaa; font-size: 13px;">${dateStr}</td>
            <td style="text-align: center;">
                <button class="delete-btn" data-id="${v.id}">삭제</button>
            </td>
        `;

        const btn = tr.querySelector(".delete-btn");
        btn.addEventListener("click", () => handleDelete(v.id, v.title, btn));
        tableBody.appendChild(tr);
    });
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function handleDelete(videoId, videoTitle, button) {
    if (!confirm(`정말 "${videoTitle}" 영상을 영구 삭제하시겠습니까?`)) {
        return;
    }

    button.disabled = true;
    button.textContent = "삭제 중...";

    try {
        const response = await fetch(`${API_BASE_URL}/api/videos/${encodeURIComponent(videoId)}`, {
            method: "DELETE",
            headers: {
                Authorization: `Bearer ${token}`
            }
        });
        const resData = await response.json();
        if (!response.ok) {
            throw new Error(resData.detail || "삭제에 실패했습니다.");
        }
        alert("영상이 성공적으로 삭제되었습니다.");
        allVideos = allVideos.filter(v => v.id !== videoId);
        renderTable(searchInput.value);
    } catch (err) {
        alert("영상 삭제 오류: " + err.message);
        button.disabled = false;
        button.textContent = "삭제";
    }
}

async function loadVideos() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/videos`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "영상 목록 로드 실패");
        allVideos = data;
        renderTable(searchInput.value);
    } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff6b6b; padding: 40px;">목록 로드 실패: ${err.message}</td></tr>`;
    }
}

searchInput.addEventListener("input", () => renderTable(searchInput.value));

initAuthNav();
checkAdminAuth().then(ok => {
    if (ok) loadVideos();
});
</script>
</body>
</html>
