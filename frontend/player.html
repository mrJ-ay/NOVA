<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA 플레이어</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><div class="logo">NOVA</div><div class="nav-buttons"><a href="index.html">홈</a><a href="upload.html">업로드</a></div></header>
<main class="player-page">
    <div class="player"><video id="player" controls playsinline></video></div>
    <h1 id="videoTitle">영상을 불러오는 중...</h1>
    <p id="videoInfo">NOVA</p>
</main>
<script type="module">
import { API_BASE_URL } from "./api-config.js";
const videoId = new URLSearchParams(location.search).get("video");
const player = document.getElementById("player");
const title = document.getElementById("videoTitle");
async function loadVideo() {
    if (!videoId) { title.textContent = "영상 주소가 올바르지 않습니다."; return; }
    try {
        const response = await fetch(`${API_BASE_URL}/api/videos/${encodeURIComponent(videoId)}`);
        const video = await response.json();
        if (!response.ok) throw new Error(video.detail || "영상을 찾을 수 없습니다.");
        title.textContent = video.title;
        player.src = video.url;
    } catch (error) {
        console.error(error);
        title.textContent = `영상 재생 실패: ${error.message}`;
    }
}
loadVideo();
</script>
</body>
</html>
