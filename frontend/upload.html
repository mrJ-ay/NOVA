<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA 업로드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><div class="logo">NOVA</div><div class="nav-buttons"><a href="index.html">홈</a><a href="login.html">로그인</a></div></header>
<main class="upload-container">
    <h1>영상 업로드</h1>
    <input id="title" type="text" placeholder="영상 제목">
    <input id="videoFile" type="file" accept="video/*">
    <button id="uploadButton" type="button">업로드</button>
    <p id="message" aria-live="polite"></p>
</main>
<script type="module">
import { supabase } from "./supabase.js";
import { API_BASE_URL } from "./api-config.js";
const titleInput = document.getElementById("title");
const fileInput = document.getElementById("videoFile");
const button = document.getElementById("uploadButton");
const message = document.getElementById("message");
button.addEventListener("click", uploadVideo);

async function uploadVideo() {
    const title = titleInput.value.trim();
    const file = fileInput.files[0];
    if (!title) { message.textContent = "영상 제목을 입력하세요."; return; }
    if (!file) { message.textContent = "영상을 선택하세요."; return; }
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { message.textContent = "로그인 후 업로드하세요."; return; }
    button.disabled = true;
    message.textContent = "영상 업로드 중...";
    try {
        const form = new FormData();
        form.append("title", title);
        form.append("file", file);
        const response = await fetch(`${API_BASE_URL}/api/upload`, {
            method: "POST",
            headers: { Authorization: `Bearer ${session.access_token}` },
            body: form
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "업로드에 실패했습니다.");
        message.textContent = "업로드가 완료됐습니다.";
        titleInput.value = "";
        fileInput.value = "";
    } catch (error) {
        console.error(error);
        message.textContent = `업로드 실패: ${error.message}`;
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
