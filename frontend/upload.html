<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA 업로드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar"><div class="logo">NOVA</div><div class="nav-buttons"><a href="index.html">홈</a><a id="authLink" href="login.html">로그인</a><a id="adminLink" href="admin.html" hidden>관리자</a></div></header>
<main class="upload-container">
    <h1>영상 업로드</h1>
    <input id="title" type="text" placeholder="영상 제목">
    <input id="videoFile" type="file" accept="video/*">
    <button id="uploadButton" type="button">업로드</button>
    <p id="message" aria-live="polite"></p>
</main>
<script type="module">
import { API_BASE_URL } from "./api-config.js";
const authLink = document.getElementById("authLink");
const adminLink = document.getElementById("adminLink");
const titleInput = document.getElementById("title");
const fileInput = document.getElementById("videoFile");
const button = document.getElementById("uploadButton");
const message = document.getElementById("message");
button.addEventListener("click", uploadVideo);

function updateAuthLink(session) {
    if (!session) adminLink.hidden = true;
    if (session) {
        authLink.textContent = "로그아웃";
        authLink.href = "#logout";
        authLink.onclick = logout;
    } else {
        authLink.textContent = "로그인";
        authLink.href = "login.html";
        authLink.onclick = null;
    }
}

async function logout(event) {
    event.preventDefault();
    authLink.textContent = "로그아웃 중...";
    authLink.onclick = null;
    localStorage.removeItem("nova_access_token");
    localStorage.removeItem("nova_user");
    updateAuthLink(null);
}

updateAuthLink(localStorage.getItem("nova_access_token"));

async function showAdminLinkForAdmins() {
    const token = localStorage.getItem("nova_access_token");
    if (!token) return;
    try {
        const response = await fetch(`${API_BASE_URL}/api/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
        if (!response.ok) return;
        const user = await response.json();
        adminLink.hidden = !user.is_admin;
    } catch (error) { console.error("관리자 메뉴 권한 확인 실패", error); }
}
showAdminLinkForAdmins();

async function uploadVideo() {
    const title = titleInput.value.trim();
    const file = fileInput.files[0];
    if (!title) { message.textContent = "영상 제목을 입력하세요."; return; }
    if (!file) { message.textContent = "영상을 선택하세요."; return; }
    const accessToken = localStorage.getItem("nova_access_token");
    if (!accessToken) { message.textContent = "로그인 후 업로드하세요."; return; }
    button.disabled = true;
    message.textContent = "영상 업로드 중...";
    try {
        const form = new FormData();
        form.append("title", title);
        form.append("file", file);
        const response = await fetch(`${API_BASE_URL}/api/upload`, {
            method: "POST",
            headers: { Authorization: `Bearer ${accessToken}` },
            body: form
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "업로드에 실패했습니다.");
        message.textContent = "업로드가 완료됐습니다.";
        titleInput.value = "";
        fileInput.value = "";
    } catch (error) {
        console.error(error);
        message.textContent = `업로드 실패: ${error.message}`;
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
