<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
    <div class="logo">NOVA</div>
    <form class="search" id="searchForm" role="search">
        <input id="searchInput" type="search" placeholder="영상 제목 검색" aria-label="영상 제목 검색">
        <button type="submit">검색</button>
    </form>
    <div class="nav-buttons"><a id="authLink" href="login.html">로그인</a><a href="upload.html">업로드</a><a href="admin.html">관리자</a></div>
</header>
<main class="container">
    <h1 id="pageTitle">최신 영상</h1>
    <section id="videoGrid" class="video-grid" aria-live="polite"><p>영상을 불러오는 중...</p></section>
</main>
<script type="module">
import { API_BASE_URL } from "./api-config.js";
const videoGrid = document.getElementById("videoGrid");
const searchForm = document.getElementById("searchForm");
const searchInput = document.getElementById("searchInput");
const pageTitle = document.getElementById("pageTitle");
let allVideos = [];

const authLink = document.getElementById("authLink");
async function logout(event) {
    event.preventDefault();
    authLink.textContent = "로그아웃 중...";
    authLink.onclick = null;
    localStorage.removeItem("nova_access_token");
    localStorage.removeItem("nova_user");
    updateAuthLink(null);
}

function updateAuthLink(session) {
    if (session) {
        authLink.textContent = "로그아웃";
        authLink.href = "#logout";
        authLink.onclick = logout;
    } else {
        authLink.textContent = "로그인";
        authLink.href = "login.html";
        authLink.onclick = null;
    }
}

updateAuthLink(localStorage.getItem("nova_access_token"));

function renderVideos(query = "") {
    const normalizedQuery = query.trim().toLocaleLowerCase();
    const filtered = allVideos.filter(v => (v.title || "").toLocaleLowerCase().includes(normalizedQuery));
    videoGrid.replaceChildren();
    pageTitle.textContent = normalizedQuery ? `검색 결과 (${filtered.length})` : "최신 영상";
    if (!filtered.length) {
        const p = document.createElement("p");
        p.textContent = normalizedQuery ? "검색 결과가 없습니다. 다른 제목으로 검색해 보세요." : "아직 업로드된 영상이 없습니다.";
        videoGrid.appendChild(p);
        return;
    }
    filtered.forEach(v => {
        const card = document.createElement("article");
        card.className = "video-card";
        const preview = document.createElement("video");
        preview.className = "thumbnail-video";
        preview.src = v.url;
        preview.muted = true;
        preview.preload = "metadata";
        preview.playsInline = true;
        const title = document.createElement("h2");
        title.textContent = v.title;
        const label = document.createElement("p");
        label.textContent = v.uploader_name || "NOVA";
        card.append(preview, title, label);
        card.addEventListener("click", () => location.href = `player.html?video=${encodeURIComponent(v.id)}`);
        videoGrid.appendChild(card);
    });
}

async function loadVideos() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/videos`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "영상 목록을 불러오지 못했습니다.");
        allVideos = data;
        renderVideos(searchInput.value);
    } catch (error) {
        console.error(error);
        videoGrid.replaceChildren();
        const p = document.createElement("p");
        p.textContent = `영상 목록을 불러오지 못했습니다: ${error.message}`;
        videoGrid.appendChild(p);
    }
}
searchForm.addEventListener("submit", e => { e.preventDefault(); renderVideos(searchInput.value); });
searchInput.addEventListener("input", () => renderVideos(searchInput.value));
loadVideos();
</script>
</body>
</html>
