<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA ONEID 로그인</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <h1>NOVA</h1>
    <h2>ONEID 공통 로그인</h2>
    <p>NOVA와 연결된 ONEID 계정으로 로그인하세요.</p>
    <button id="loginButton" type="button">ONEID로 로그인</button>
    <section id="migrationPanel" hidden>
        <hr><h3>기존 NOVA 계정 연결</h3>
        <p>기존 영상을 이어 관리하려면 예전 이메일과 비밀번호를 한 번 입력하세요.</p>
        <input id="legacyEmail" type="email" placeholder="기존 이메일" autocomplete="username">
        <input id="legacyPassword" type="password" placeholder="기존 비밀번호" autocomplete="current-password">
        <button id="linkLegacyButton" type="button">기존 계정 연결</button>
        <button id="createNewButton" type="button">새 NOVA 계정으로 시작</button>
    </section>
    <p id="message" aria-live="polite"></p>
    <a href="index.html">홈으로</a>
</div>
<script type="module" src="oneid-login.js"></script>
</body>
</html>
