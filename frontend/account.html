<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA 계정</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .account-container { max-width: 700px; margin: 50px auto; padding: 28px; }
        .account-card { padding: 24px; background: #181818; border: 1px solid #333; border-radius: 10px; }
        .account-card p { color: #bbb; line-height: 1.6; }
        .delete-account { margin-top: 24px; padding: 12px 18px; color: white; background: #a83232; border: 0; border-radius: 6px; cursor: pointer; }
        .delete-account:disabled { opacity: .6; cursor: wait; }
    </style>
</head>
<body>
<header class="navbar"><div class="logo">NOVA</div><div class="nav-buttons"><a href="index.html">홈</a><a href="upload.html">업로드</a></div></header>
<main class="account-container">
    <h1>내 계정</h1>
    <section class="account-card">
        <p id="accountStatus" aria-live="polite">계정 정보를 불러오는 중...</p>
        <p>계정을 삭제하면 다시 로그인할 수 없습니다. 올린 영상과 댓글은 남고, 이 계정의 좋아요는 삭제됩니다.</p>
        <button id="deleteAccount" class="delete-account" type="button" hidden>내 계정 삭제</button>
    </section>
</main>
<script type="module">
import { API_BASE_URL } from "./api-config.js";

const status = document.getElementById("accountStatus");
const deleteButton = document.getElementById("deleteAccount");
const token = localStorage.getItem("nova_access_token");
let accountNickname = "";

async function request(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: { Authorization: `Bearer ${token}`, ...(options.headers || {}) }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.detail || `요청 실패 (${response.status})`);
    return result;
}

if (!token) {
    status.textContent = "계정 관리를 하려면 먼저 로그인하세요.";
    setTimeout(() => { location.href = "login.html"; }, 1200);
} else {
    try {
        const user = await request(`${API_BASE_URL}/api/auth/me`);
        accountNickname = user.nickname;
        status.textContent = `로그인 계정: ${user.nickname}${user.is_admin ? " · 관리자" : ""}`;
        deleteButton.hidden = false;
    } catch (error) {
        status.textContent = `계정 정보를 불러오지 못했습니다: ${error.message}`;
        if (error.message.includes("토큰") || error.message.includes("로그인")) {
            localStorage.removeItem("nova_access_token");
            localStorage.removeItem("nova_user");
            setTimeout(() => { location.href = "login.html"; }, 1500);
        }
    }
}

deleteButton.addEventListener("click", async () => {
    const nickname = accountNickname;
    if (!nickname) return;
    const confirmation = prompt(`계정을 삭제하려면 닉네임 '${nickname}'을 입력하세요.`);
    if (confirmation !== nickname) {
        if (confirmation !== null) status.textContent = "닉네임이 일치하지 않아 삭제하지 않았습니다.";
        return;
    }
    deleteButton.disabled = true;
    status.textContent = "계정을 삭제하는 중...";
    try {
        const result = await request(`${API_BASE_URL}/api/auth/me`, { method: "DELETE" });
        localStorage.removeItem("nova_access_token");
        localStorage.removeItem("nova_user");
        status.textContent = result.message;
        deleteButton.hidden = true;
        setTimeout(() => { location.href = "index.html"; }, 1800);
    } catch (error) {
        status.textContent = `계정 삭제 실패: ${error.message}`;
        deleteButton.disabled = false;
    }
});
</script>
</body>
</html>
